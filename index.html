 if(!S.talk){S.talk=1;return say([L("A, sử quan mới! Đừng làm mặt nghiêm thế, ở đây ai cũng quen ta."),L("Đêm thành sụp ư? Trăng tròn vành vạnh, ta ở bến đò cả đêm. Chẳng thấy lửa nào hết."),["Bạn","(Hãy tìm chi tiết trong làng để đối chiếu lời khai. Dùng Q để nhìn sang cõi Bị Quên.)"]])}
 const own=Object.keys(S.clues);
 if(!own.length)return say([["Bạn","Mình chưa có gì để đối chất cả."]]);
 const o=own.map(id=>["Đưa ra: "+CL[id][0],()=>conf(id)]);o.push(["Để sau",()=>{}]);
 say([L("Lại hỏi nữa à? Cứ đưa ra đi."),["Bạn","Lục, anh giải thích cái này thế nào?"]],null,o)}
function conf(id){
 if(id=='statue'){if(!S.c1){S.c1=1;S.cr++}return say([L("Trăng khuyết? ...Chắc ta nhớ nhầm. Đêm đó loạn lắm, ai mà nhớ rõ.")])}
 if(id=='rope'){if(!S.c2){S.c2=1;S.cr++}return say([L("Lửa... ừ thì có lửa. Nhưng chỉ ở bến thôi! Ta... ta không nói dối, chỉ là không muốn nhớ.")])}
 if(S.cr<1)return say([L("Một trang rách thì chứng minh được gì? Ta không hiểu.")]);
 say([L("..."),L("Phải. Ta là lính giữ cầu đêm ấy. Ta đứng nhìn nó cháy và không làm gì."),L("Ta chèo đò để chở những người ta đã bỏ lại. Giờ ngươi sẽ ghi sao đây, sử quan?")],null,[
 ["Ghi sự thật (−1 Mực, mất 1 ký ức)",()=>rec('truth')],["Ghi «Lục vô tội» (−1 Mực, mất 1 ký ức)",()=>rec('lie')],["Không ghi gì",()=>rec('none')]])}
function rec(t){
 const M=["tên người thầy dạy bạn viết chữ","mùi trà mẹ pha mỗi sáng","bài hát ru thuở nhỏ"];
 let m='';if(t!='none'){S.ink--;m=M[S.kills%3]+'.';}
 const T={truth:"Bản sử được cố định: Lục là lính giữ cầu. Làng xôn xao, nhưng Lục thở nhẹ. Lần đầu bạn thấy anh không cười. Viện Sử sẽ không hài lòng; Lục sẽ đi cùng bạn.",
 lie:"«Lục vô tội» được cố định. Sương mỏng đi, cây cầu hiện ra trong cõi Được Nhớ. Nhưng bạn thoáng nghe ai đó khóc dưới sông. Viện Sử mỉm cười hài lòng.",
 none:"Bạn gập sổ lại. Chưa ai ghi gì, sương dày thêm, và Lục lặng lẽ quay đi."};
 S.end=1;$('et').innerHTML=T[t]+(m?'<br><br><i>Bạn đã quên: '+m+'</i>':'')+'<br><br>Đây là bản chơi thử Tiền chương. Quyết định này sẽ được lưu thành cờ trạng thái cho các chương sau.';
 $('end').style.display='flex'}
function tex(k,w,h,fn){const g=sc.make.graphics({add:false});fn(g);g.generateTexture(k,w,h);g.destroy()}
function create(){
 sc=this;const W=1280,H=720;
 const fr=(k,arr)=>sc.anims.create({key:k,frames:sc.anims.generateFrameNumbers('pl',{frames:arr}),frameRate:k=='wu'?6:8,repeat:-1});
 fr('wd',[0,1,2,3]);fr('wu',[4,5]);fr('ws',[6,7,8,9]);
 const pat=(c0,c1,c2,c3)=>g=>{g.fillStyle(c0).fillRect(0,0,32,32);[[3,5],[14,2],[24,9],[8,17],[19,22],[28,27],[5,28],[12,11]].forEach(([x,y],i)=>{g.fillStyle(i%2?c1:c2).fillRect(x,y,3,2)});g.fillStyle(c3).fillRect(10,24,1,3).fillRect(26,14,1,3).fillRect(4,10,1,3)};
 tex('gr',32,32,pat(0x10262a,0x17383a,0x0c1e21,0x24504a));
 tex('gr2',32,32,pat(0x1c1630,0x2a2050,0x140f24,0x6a4aa0));
 tex('pv',16,16,g=>{g.fillStyle(0x4c4b55).fillRect(0,0,16,16);g.fillStyle(0x3a3944).fillRect(0,7,16,1).fillRect(7,0,1,8).fillRect(3,8,1,8).fillRect(12,8,1,8);g.fillStyle(0x5e5d68).fillRect(1,1,5,1).fillRect(9,9,5,1)});
 tex('wt',32,32,g=>{g.fillStyle(0x14304a).fillRect(0,0,32,32);g.fillStyle(0x2a5a7a).fillRect(4,6,8,1).fillRect(18,16,10,1).fillRect(8,26,7,1);g.fillStyle(0x0e2236).fillRect(20,4,6,1)});
 tex('rp',12,8,g=>{g.fillStyle(0x6a4a2a).fillRect(0,3,12,3);g.fillStyle(0x222).fillRect(8,3,4,3)});
 tex('gl',96,96,g=>{for(let i=6;i>0;i--){g.fillStyle(0xffa840,.07).fillCircle(48,48,i*8)}});
 gnd=sc.add.tileSprite(W/2,H/2,W,H,'gr').setDepth(-20);
 wt=sc.add.tileSprite(W/2,50,W,100,'wt').setDepth(-19);
 sc.add.tileSprite(330,605,540,32,'pv').setDepth(-18);sc.add.tileSprite(600,385,32,480,'pv').setDepth(-18);sc.add.tileSprite(600,170,220,64,'pv').setDepth(-18);
 sc.add.rectangle(600,92,84,40,0x5a4228).setDepth(-17);
 sc.physics.world.setBounds(0,0,W,H);
 const walls=sc.physics.add.staticGroup();
 const blk=(x,y,w,h)=>{const r=sc.add.rectangle(x,y,w,h);sc.physics.add.existing(r,true);walls.add(r)};
 blk(W/2,50,W,100);blk(6,H/2,12,H);blk(W-6,H/2,12,H);blk(W/2,H-6,W,12);
 const key=[[100,600],[600,140],[150,560],[540,150],[300,380],[690,130],[1000,560],[800,380],[1000,300],[500,560],[900,560]];
 const obj=(k,x,y,sc2)=>{const o=sc.add.image(x,y,'o_'+k).setOrigin(.5,1).setDepth(y);if(sc2)o.setScale(sc2);
  sc.physics.add.existing(o,true);const w=o.width,h=o.height,bw=w*.6,bh=Math.max(8,h*.22);o.body.setSize(bw,bh).setOffset((w-bw)/2,h-bh);o.body.updateFromGameObject&&0;walls.add(o);return o};
 obj('houseB',330,270);obj('houseC',170,250);obj('chapel',1060,260);obj('pool1',1000,450,1.5);obj('houseC',900,250,1);
 const T=['bigtree','tree2','tree4','tall','tree5','bush','tree3'];
 [[60,170],[40,260],[70,360],[40,450],[60,540],[40,650],[170,690],[290,680],[420,695],[560,690],[700,695],[830,685],[960,695],[1090,685],[1210,695],[1230,600],[1220,500],[1235,400],[1220,300],[1240,200],[1200,140],[110,130],[420,470],[740,520],[780,260],[460,300],[260,500],[1110,380],[700,330],[420,210],[250,330],[1150,590],[620,450],[860,470]].forEach(([x,y],i)=>{
  if(key.some(k=>Math.hypot(k[0]-x,k[1]-y)<60))return;obj(T[i%T.length],x,y)});
 const addI=(s,fn)=>{I.push({s,fn})};
 [[150,560],[540,150]].forEach(p=>{sc.add.image(p[0],p[1]-6,'gl').setDepth(1);const l=sc.add.image(p[0],p[1],'lamp').setScale(.6).setDepth(p[1]);addI(l,lamp)});
 const lu=sc.add.image(600,160,'l').setOrigin(.5,1).setScale(.85).setDepth(160);sc.physics.add.existing(lu,true);lu.body.setSize(14,8).setOffset(5,35);walls.add(lu);addI(lu,luc);
 const st=obj('tomb',300,400,1.1);addI(st,()=>clue('statue'));obj('tomb2',350,410,1);
 const rp=sc.add.image(690,130,'rp').setDepth(130);addI(rp,()=>clue('rope'));
 pageS=sc.add.image(1000,560,'scroll').setScale(.5).setDepth(560).setVisible(false);addI(pageS,()=>pageS.visible&&clue('page'));
 sc.tweens.add({targets:pageS,y:556,yoyo:true,repeat:-1,duration:800});
 P=sc.physics.add.sprite(100,600,'pl',0).setScale(.8);P.body.setSize(10,8).setOffset(15,47);P.setCollideWorldBounds(true);
 sc.physics.add.collider(P,walls);
 eg=sc.physics.add.group();
 [[800,380,'m_ghost',48,2],[1000,300,'m_spider',62,2],[500,560,'m_shadow',38,3],[900,560,'m_ghost',48,2]].forEach(([x,y,k,sp,hp])=>{
  const e=eg.create(x,y,k);e.setScale(36/e.height);e.hp=hp;e.spd=sp;const w=e.width,h=e.height;e.body.setSize(w*.5,h*.4).setOffset(w*.25,h*.5)});
 sc.physics.add.collider(eg,walls);sc.physics.add.collider(eg,eg);
 sc.cameras.main.setBounds(0,0,W,H).startFollow(P,true,.12,.12);
 ov=sc.add.rectangle(320,180,640,360,0x6a3fa0,.22).setScrollFactor(0).setDepth(99999).setVisible(false);
 hud();
 say([["Thư của Trưởng lão Mặc","Con hãy đến làng Sương Mờ và ghi lại sự thật về đêm Aldren sụp đổ. Hãy ghi chép trung thực. Chỉ sự thật mới đáng được nhớ."],["Gợi ý","Hỏi chuyện Lục, người đưa đò gần bến. Tìm manh mối trong làng, đừng để các «bản ghi lỗi» chạm vào bạn."]])
}
function act(){if(dOpen)return adv();if(bOpen)return;
 let b=null,d=56;I.forEach(i=>{const n=Math.hypot(i.s.x-P.x,i.s.y+(.5-i.s.originY)*i.s.displayHeight-(P.y-4));if(n<d&&i.s.visible!==false){d=n;b=i}});if(b)b.fn()}
function atk(){if(dOpen)return adv();if(bOpen||atkCd>0)return;atkCd=350;atkT=260;P.anims.stop();P.setFrame(15);
 const ax=P.x+face.x*18,ay=P.y+face.y*18;
 const c=sc.add.circle(ax,ay,14,0xffffff,.6).setDepth(99998);sc.tweens.add({targets:c,alpha:0,scale:1.4,duration:180,onComplete:()=>c.destroy()});
 eg.children.iterate(e=>{if(e&&Math.hypot(e.x-ax,e.y-ay)<24){e.hp--;e.setTint(0xff6060);e.hitT=220;
  const a=Math.atan2(e.y-P.y,e.x-P.x);e.body.setVelocity(Math.cos(a)*220,Math.sin(a)*220);
  if(e.hp<=0){e.destroy();S.kills++;if(S.ink<5)S.ink++;hud()}}})}
function dash(){if(dOpen||bOpen||dashT>0)return;dashT=160;invul=Math.max(invul,300)}
function realm(){if(dOpen||bOpen)return;S.realm^=1;gnd.setTexture(S.realm?'gr2':'gr');ov.setVisible(!!S.realm);pageS.setVisible(!!S.realm);hud()}
function update(t,dt){
 P.setDepth(P.y+22);eg.children.iterate(e=>e&&e.setDepth(e.y+e.displayHeight*.4));wt.tilePositionX+=dt*.012;
 if(dOpen||bOpen){P.setVelocity(0);P.anims.stop();eg.children.iterate(e=>e&&e.setVelocity(0));return}
 let x=(K.right?1:0)-(K.left?1:0),y=(K.down?1:0)-(K.up?1:0);
 if(x||y){const l=Math.hypot(x,y);x/=l;y/=l;face={x,y}}
 if(dashT>0){dashT-=dt;P.setVelocity(face.x*300,face.y*300)}else P.setVelocity(x*95,y*95);
 if(invul>0)invul-=dt;if(atkCd>0)atkCd-=dt;
 const side=Math.abs(face.x)>Math.abs(face.y);P.setFlipX(side&&face.x<0);
 if(atkT>0){atkT-=dt}else if((x||y)&&dashT<=0){P.anims.play(side?'ws':(face.y>0?'wd':'wu'),true)}else{P.anims.stop();P.setFrame(side?6:(face.y<0?4:0))}
 P.setAlpha(invul>0&&Math.floor(t/80)%2?.4:1);
 eg.children.iterate(e=>{if(!e)return;
  if(e.hitT>0){e.hitT-=dt;if(e.hitT<=0)e.clearTint();return}
  const d=Math.hypot(P.x-e.x,P.y-e.y);
  if(d<170){e.body.setVelocity((P.x-e.x)/d*e.spd,(P.y-e.y)/d*e.spd);e.setFlipX(P.x<e.x)}else e.body.setVelocity(0);
  if(d<22&&invul<=0){S.hp--;invul=1000;hud();const a=Math.atan2(P.y-e.y,P.x-e.x);dashT=0;P.setVelocity(Math.cos(a)*200,Math.sin(a)*200);
   if(S.hp<=0){S.hp=5;P.setPosition(100,600);hud();say([["","Bạn gục xuống trong sương... rồi tỉnh dậy cạnh ngọn đèn đầu làng."]])}}})
}
const km={w:'up',arrowup:'up',s:'down',arrowdown:'down',a:'left',arrowleft:'left',d:'right',arrowright:'right'};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(km[k]){K[km[k]]=1;e.preventDefault()}
 if(k=='e'||k=='enter')act();else if(k==' '){atk();e.preventDefault()}else if(k=='shift')dash();else if(k=='q')realm();else if(k=='b'||k=='escape'){if(!dOpen)book()}});
addEventListener('keyup',e=>{const k=km[e.key.toLowerCase()];if(k)K[k]=0});
addEventListener('blur',()=>{K={}});
const bind=(id,d,u)=>{const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();d()});['pointerup','pointerleave','pointercancel'].forEach(n=>e.addEventListener(n,()=>u&&u()))};
[['bu','up'],['bd','down'],['bl','left'],['br','right']].forEach(([i,k])=>bind(i,()=>K[k]=1,()=>K[k]=0));
bind('ba',act);bind('bk',atk);bind('bs',dash);bind('bq',realm);bind('bb',()=>{if(!dOpen)book()});
const cols=['#4a5fa8','#8a3a3a','#3a7a5a'];
cols.forEach((c,i)=>{const s=document.createElement('span');s.className='sw'+(i?'':' on');s.style.background=c;
 s.onclick=()=>{S.coat=c;[...$('sws').children].forEach(x=>x.classList.remove('on'));s.classList.add('on')};$('sws').appendChild(s)});
$('go').onclick=()=>{S.name=$('nm').value.trim()||'Bạn';$('start').style.display='none';
 new Phaser.Game({type:Phaser.AUTO,parent:'g',width:640,height:360,pixelArt:true,backgroundColor:'#070d18',physics:{default:'arcade'},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:{preload,create,update}})};
